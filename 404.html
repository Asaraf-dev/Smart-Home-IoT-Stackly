<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B10" />
    <meta name="description"
        content="The page you're looking for couldn't be found. Return to Stackly and explore intelligent living." />
    <title>Page Not Found | Stackly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/404.css" />
</head>

<body>
    <!--- 404 Main Section Start --->
    <main class="sh-err-main">
        <div class="sh-err-grid"></div>
        <div class="sh-err-glow sh-err-glow-one"></div>
        <div class="sh-err-glow sh-err-glow-two"></div>
        <!--- Decorative Floating Elements --->
        <div class="sh-err-float sh-err-float-one"><i class="bi bi-wifi"></i></div>
        <div class="sh-err-float sh-err-float-two"><i class="bi bi-lightbulb"></i></div>
        <div class="sh-err-float sh-err-float-three"><i class="bi bi-cpu"></i></div>
        <!--- 404 Content --->
        <section class="sh-err-content">
            <!--- Smart Home Illustration --->
            <div class="sh-err-visual" aria-hidden="true">
                <div class="sh-err-orbit sh-err-orbit-one"></div>
                <div class="sh-err-orbit sh-err-orbit-two"></div>
                <div class="sh-err-orbit sh-err-orbit-three"></div>
                <div class="sh-err-visual-ring"></div>
                <div class="sh-err-house">
                    <i class="bi bi-house-door"></i>
                    <span class="sh-err-house-window sh-err-house-window-one"></span>
                    <span class="sh-err-house-window sh-err-house-window-two"></span>
                    <span class="sh-err-house-door"></span>
                </div>
                <span class="sh-err-visual-node sh-err-node-one"><i class="bi bi-wifi"></i></span>
                <span class="sh-err-visual-node sh-err-node-two"><i class="bi bi-lightning-charge"></i></span>
                <span class="sh-err-visual-node sh-err-node-three"><i class="bi bi-shield-check"></i></span>
                <span class="sh-err-visual-cross sh-err-cross-one">+</span>
                <span class="sh-err-visual-cross sh-err-cross-two">+</span>
            </div>
            <!--- Error Message --->
            <div class="sh-err-code"><span>4</span><span class="sh-err-code-zero">0</span><span>4</span></div>
            <h1 class="sh-err-title">Looks like this home <span>isn't connected.</span></h1>
            <p class="sh-err-description">We couldn't find the page you're looking for. It may have moved, been removed,
                or taken a wrong turn in the smart home network.</p>
            <!--- Navigation Actions --->
            <div class="sh-err-actions">
                <button type="button" class="sh-err-btn sh-err-btn-primary" id="sh-err-back">
                    <i class="bi bi-arrow-left"></i><span>Go Back</span>
                </button>
                <a href="index.html" class="sh-err-btn sh-err-btn-secondary">
                    <i class="bi bi-house-door"></i><span>Go to Home</span><i
                        class="bi bi-arrow-up-right sh-err-btn-arrow"></i>
                </a>
            </div>
            <!--- Connection Status --->
            <div class="sh-err-footnote"><span class="sh-err-footnote-line"></span><i
                    class="bi bi-compass"></i><span>Let's get you back on the right path.</span><span
                    class="sh-err-footnote-line"></span></div>
        </section>
        <!--- Background Coordinates --->
        <span class="sh-err-coordinate sh-err-coordinate-left">SYS_ERR_404</span>
        <span class="sh-err-coordinate sh-err-coordinate-right">STACKLY / SMART LIVING</span>
    </main>
    <!--- 404 Main Section End --->
    <!--- JavaScript Files --->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/404.js"></script>
</body>

</html>
